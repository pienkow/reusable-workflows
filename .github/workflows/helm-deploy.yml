name: Helm Deploy

on:
  workflow_call:
    inputs:
      chart_path:
        description: 'Path to Helm chart'
        required: true
        type: string
      release_name:
        description: 'Helm release name'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: false
        type: string
        default: 'gwiazdeczkowe-animacje'
      version:
        description: 'Application version to deploy'
        required: true
        type: string
      values_file:
        description: 'Path to values file (optional)'
        required: false
        type: string
        default: ''
      create_namespace:
        description: 'Create namespace if it does not exist'
        required: false
        type: boolean
        default: false
      timeout:
        description: 'Timeout for helm operations'
        required: false
        type: string
        default: '10m'
      environment:
        description: 'GitHub Environment name for deployment protection (e.g., development, production)'
        required: false
        type: string
        default: ''
      cloudflare_purge_cache:
        description: 'Whether to purge Cloudflare cache after deployment'
        required: false
        type: boolean
        default: true
    secrets:
      KUBECONFIG:
        description: 'Kubernetes config file content'
        required: true
      CLOUDFLARE_API_TOKEN:
        description: 'Cloudflare API token for cache purging'
        required: false
      CLOUDFLARE_ZONE_ID_KILIMA:
        description: 'Cloudflare Zone ID for kilima.pl'
        required: false
      CLOUDFLARE_ZONE_ID_PARTYFLOW:
        description: 'Cloudflare Zone ID for partyflow.app'
        required: false

jobs:
  deploy:
    runs-on: ${{ vars.DEFAULT_RUNNER }}
    environment: ${{ inputs.environment != '' && inputs.environment || null }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Setup Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "ERROR: KUBECONFIG secret is empty!"
            exit 1
          fi
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "Kubeconfig file created at $HOME/.kube/config"
          ls -la $HOME/.kube/config
          echo "Kubeconfig file size: $(wc -c < $HOME/.kube/config) bytes"
          echo "First line of kubeconfig (for verification):"
          head -n 1 $HOME/.kube/config

      - name: Verify Kubernetes connection
        run: |
          kubectl version --client
          kubectl cluster-info

      - name: Update Helm chart version
        run: |
          # Determine which values file to update
          VALUES_FILE="${{ inputs.values_file }}"
          if [ -z "$VALUES_FILE" ]; then
            VALUES_FILE="${{ inputs.chart_path }}/values.yaml"
          fi

          echo "Updating image tag in: $VALUES_FILE"
          # Update image tag in values file
          sed -i "s/tag: .*/tag: \"${{ inputs.version }}\"/" "$VALUES_FILE"

      - name: Helm lint
        run: |
          # Determine which values file to use for linting
          VALUES_FILE="${{ inputs.values_file }}"
          if [ -z "$VALUES_FILE" ]; then
            VALUES_FILE="${{ inputs.chart_path }}/values.yaml"
          fi

          echo "Linting chart with values file: $VALUES_FILE"
          helm lint ${{ inputs.chart_path }} --values "$VALUES_FILE"

      - name: Helm upgrade/install
        run: |
          # Determine which values file to use
          VALUES_FILE="${{ inputs.values_file }}"
          if [ -z "$VALUES_FILE" ]; then
            VALUES_FILE="${{ inputs.chart_path }}/values.yaml"
          fi

          echo "Using values file: $VALUES_FILE"

          HELM_CMD="helm upgrade --install ${{ inputs.release_name }} ${{ inputs.chart_path }} \
            --namespace ${{ inputs.namespace }} \
            --values $VALUES_FILE \
            --timeout ${{ inputs.timeout }} \
            --wait"

          if [ "${{ inputs.create_namespace }}" = "true" ]; then
            HELM_CMD="$HELM_CMD --create-namespace"
          fi

          eval $HELM_CMD

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ inputs.namespace }} -l app.kubernetes.io/name=${{ inputs.release_name }}
          kubectl get services -n ${{ inputs.namespace }} -l app.kubernetes.io/name=${{ inputs.release_name }}

      - name: Deployment Summary
        run: |
          echo "### Helm Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** \`${{ inputs.release_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** \`${{ inputs.namespace }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** \`${{ inputs.chart_path }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Purge Cloudflare Cache
        if: ${{ inputs.cloudflare_purge_cache == true && secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "Purging Cloudflare cache for both zones..."

          # Function to purge cache for a zone
          purge_zone() {
            local ZONE_ID=$1
            local ZONE_NAME=$2

            if [ -z "$ZONE_ID" ]; then
              echo "⚠️ Skipping $ZONE_NAME - Zone ID not provided"
              return 0
            fi

            echo "Purging cache for $ZONE_NAME (Zone ID: ${ZONE_ID:0:8}...)"

            HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/cf_response.json \
              -X POST "https://api.cloudflare.com/v4/zones/$ZONE_ID/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Successfully purged cache for $ZONE_NAME"
              return 0
            else
              echo "❌ Failed to purge cache for $ZONE_NAME (HTTP $HTTP_CODE)"
              cat /tmp/cf_response.json
              return 1
            fi
          }

          # Purge both zones
          KILIMA_SUCCESS=0
          PARTYFLOW_SUCCESS=0

          if [ -n "${{ secrets.CLOUDFLARE_ZONE_ID_KILIMA }}" ]; then
            purge_zone "${{ secrets.CLOUDFLARE_ZONE_ID_KILIMA }}" "kilima.pl" && KILIMA_SUCCESS=1
          fi

          if [ -n "${{ secrets.CLOUDFLARE_ZONE_ID_PARTYFLOW }}" ]; then
            purge_zone "${{ secrets.CLOUDFLARE_ZONE_ID_PARTYFLOW }}" "partyflow.app" && PARTYFLOW_SUCCESS=1
          fi

          # Add to summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cloudflare Cache Purging" >> $GITHUB_STEP_SUMMARY
          [ $KILIMA_SUCCESS -eq 1 ] && echo "- ✅ kilima.pl cache purged" >> $GITHUB_STEP_SUMMARY || echo "- ⚠️ kilima.pl cache purge skipped" >> $GITHUB_STEP_SUMMARY
          [ $PARTYFLOW_SUCCESS -eq 1 ] && echo "- ✅ partyflow.app cache purged" >> $GITHUB_STEP_SUMMARY || echo "- ⚠️ partyflow.app cache purge skipped" >> $GITHUB_STEP_SUMMARY

          # Don't fail the whole workflow if cache purge fails
          exit 0
