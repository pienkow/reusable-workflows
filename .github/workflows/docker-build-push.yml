name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Name of the Docker image (e.g., gwiazdeczkowe/api)'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      context_path:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      version:
        description: 'Version tag for the image'
        required: true
        type: string
      runner:
        description: 'Runner label to use'
        required: false
        type: string
        default: 'kilima-prod-runners'
      registry:
        description: 'Docker registry URL'
        required: false
        type: string
        default: 'docker.k3s-prod.lan'
    secrets:
      VAULT_ADDR:
        description: 'Vault address'
        required: true
      VAULT_TOKEN:
        description: 'Vault token'
        required: true
      CA_CERT:
        description: 'Custom CA certificate (PEM) for self-signed services'
        required: true

jobs:
  build-and-push:
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Install CA certificate
        run: |
          echo "${{ secrets.CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/custom-ca.crt > /dev/null
          sudo update-ca-certificates
          echo "${{ secrets.CA_CERT }}" > /tmp/ca-cert.pem
          echo "NODE_EXTRA_CA_CERTS=/tmp/ca-cert.pem" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import Harbor credentials from Vault
        uses: hashicorp/vault-action@v3
        id: vault
        with:
          url: ${{ secrets.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          caCertificate: ${{ secrets.CA_CERT }}
          tlsSkipVerify: true
          secrets: |
            secret/data/harbor admin_password | HARBOR_PASSWORD

      - name: Login to Harbor
        run: |
          echo "${{ steps.vault.outputs.HARBOR_PASSWORD }}" | docker login ${{ inputs.registry }} --username admin --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.version }} \
            -t ${{ inputs.registry }}/${{ inputs.image_name }}:latest \
            --build-arg VERSION=${{ inputs.version }} \
            -f ${{ inputs.dockerfile_path }} \
            ${{ inputs.context_path }}

      - name: Push Docker image
        run: |
          docker push ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.version }}
          docker push ${{ inputs.registry }}/${{ inputs.image_name }}:latest

      - name: Image Summary
        run: |
          echo "### Docker Image Built Successfully! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ inputs.registry }}/${{ inputs.image_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
